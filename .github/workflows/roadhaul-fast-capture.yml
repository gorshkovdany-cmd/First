name: RoadHaul PSP screenshot fast path
on:
  push:
    branches: [psp-roadhaul-build]
    paths: [.github/workflows/roadhaul-fast-capture.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/roadhaul-fast-capture.yml]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Restore and compile game
        run: |
          mkdir -p psp-roadhaul/build
          base64 -d psp-roadhaul/source.tar.xz.base64 | tar -xJ -C psp-roadhaul/build
          docker run --rm -v "$PWD/psp-roadhaul/build:/source" -w /source pspdev/pspdev:v20261001 make -j2
      - name: Download and extract emulator official release
        run: |
          python3 - <<'PY'
          import urllib.request,json
          req=urllib.request.Request('https://api.github.com/repos/hrydgard/ppsspp/releases/tags/v1.20.4',headers={'User-Agent':'psp-capture'})
          doc=json.load(urllib.request.urlopen(req))
          asset=next(a for a in doc['assets'] if a['name'].endswith('.AppImage') and 'x86_64' in a['name'])
          urllib.request.urlretrieve(asset['browser_download_url'],'ppsspp.AppImage')
          PY
          chmod +x ppsspp.AppImage
          ./ppsspp.AppImage --appimage-extract >/dev/null
      - name: Screen capture using preinstalled tools only
        shell: bash
        run: |
          mkdir -p psp-roadhaul/screenshots
          command -v Xvfb || true
          command -v xvfb-run || true
          command -v import || true
          command -v ffmpeg || true
          timeout 90s xvfb-run -a -s '-screen 0 960x544x24 +extension GLX' bash -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            ./squashfs-root/AppRun --fullscreen "$PWD/psp-roadhaul/build/EBOOT.PBP" > psp-roadhaul/emulator.log 2>&1 &
            PID=$!
            sleep 10
            if command -v import >/dev/null; then
              import -window root psp-roadhaul/screenshots/screenshot-1.png
            else
              ffmpeg -hide_banner -y -f x11grab -video_size 960x544 -i "$DISPLAY" -frames:v 1 psp-roadhaul/screenshots/screenshot-1.png
            fi
            sleep 6
            if command -v import >/dev/null; then
              import -window root psp-roadhaul/screenshots/screenshot-2.png
            else
              ffmpeg -hide_banner -y -f x11grab -video_size 960x544 -i "$DISPLAY" -frames:v 1 psp-roadhaul/screenshots/screenshot-2.png
            fi
            kill "$PID" 2>/dev/null || true
          ' || true
          cat psp-roadhaul/emulator.log || true
          ls -lh psp-roadhaul/screenshots/ || true
      - name: Upload frames even on emulator error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoadHaul-fast-real-frames
          path: |
            psp-roadhaul/screenshots/
            psp-roadhaul/emulator.log
          if-no-files-found: warn
