name: PSP Дальний рейс 1.0 - Russian build
on:
  push:
    branches: [psp-russian-v1-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore sources
        shell: bash
        run: |
          mkdir -p build-ru
          base64 -d psp-rus/source.tar.xz.base64 | tar -xJf - -C build-ru
          test -s build-ru/src/font.h
          test -s build-ru/ICON0.PNG
      - name: Validate Russian texts and safety
        shell: bash
        working-directory: build-ru
        run: |
          python3 tests/check_russian.py
          ./tests/run_tests.sh
          ./tests/run_render_tests.sh
          ./tests/run_stress.sh
          ./tests/safety_audit.sh
      - name: Compile for PSP 3000/3008
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/build-ru:/source" -w /source pspdev/pspdev:v20261001 make -j2
          test -s build-ru/EBOOT.PBP
      - name: Validate Russian PSP menu and EBOOT sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data=Path('build-ru/EBOOT.PBP').read_bytes()
          assert data[:4]==b'\x00PBP',repr(data[:4])
          offsets=list(struct.unpack_from('<8I',data,8))
          assert len(data)>4096 and offsets==sorted(offsets) and all(40<=a<=len(data) for a in offsets)
          title='ДАЛЬНИЙ РЕЙС 1.0'.encode('utf-8')
          sfo=data[offsets[0]:offsets[1]]
          print('PBP bytes',len(data),'sections',offsets)
          print('Russian title in SFO:',title in sfo)
          assert title in sfo, 'Russian PARAM.SFO title was not embedded'
          PY
          mkdir -p release/PSP/GAME/ROADHAUL
          cp build-ru/EBOOT.PBP release/PSP/GAME/ROADHAUL/EBOOT.PBP
          cp build-ru/README_RU.md release/ПРОЧТИ_МЕНЯ.txt
          cd release && zip -q -r ../Dalniy_Reys_PSP_1_0_RU.zip .
          cd ..
          sha256sum build-ru/EBOOT.PBP Dalniy_Reys_PSP_1_0_RU.zip > SHA256SUMS.txt
          unzip -t Dalniy_Reys_PSP_1_0_RU.zip
      - name: Publish install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PSP_Dalniy_Reys_1_0_RU_install
          path: |
            Dalniy_Reys_PSP_1_0_RU.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90